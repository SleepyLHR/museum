  <script>
    App.init(function() {
      Router.init();
    });
    
    var bgmStarted = false;
    
    function tryStartBgm() {
      if (bgmStarted) return;
      bgmStarted = true;
      
      var musicEnabled = localStorage.getItem('gameSettings');
      var shouldPlay = true;
      if (musicEnabled) {
        try {
          var settings = JSON.parse(musicEnabled);
          if (settings.musicEnabled === false) {
            shouldPlay = false;
          }
        } catch (e) {}
      }
      if (shouldPlay) {
        AudioManager.startBgm();
      }
    }
    
    document.addEventListener('click', tryStartBgm, { once: true });
    document.addEventListener('touchstart', tryStartBgm, { once: true });
    document.addEventListener('keydown', tryStartBgm, { once: true });
  </script>
