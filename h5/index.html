<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>文物拼多多</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app"></div>

  <div id="toast" class="toast"></div>

  <div id="modal" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-title"></div>
      <div class="modal-body"></div>
      <div class="modal-footer"></div>
    </div>
  </div>

  <script src="js/audio.js"></script>
  <script src="js/app.js"></script>
  <script src="js/components.js"></script>
  <script src="js/router.js"></script>
  <script src="js/pages/home.js"></script>
  <script src="js/pages/game.js"></script>
  <script src="js/pages/gallery.js"></script>
  <script src="js/pages/settings.js"></script>
  <script src="js/pages/certificate.js"></script>
  <script>
    App.init(function() {
      Router.init();
    });
    
    var bgmStarted = false;
    
    function tryStartBgm() {
      if (bgmStarted) return;
      bgmStarted = true;
      
      var musicEnabled = localStorage.getItem('gameSettings');
      var shouldPlay = true;
      if (musicEnabled) {
        try {
          var settings = JSON.parse(musicEnabled);
          if (settings.musicEnabled === false) {
            shouldPlay = false;
          }
        } catch (e) {}
      }
      if (shouldPlay) {
        AudioManager.startBgm();
      }
    }
    
    document.addEventListener('click', tryStartBgm, { once: true });
    document.addEventListener('touchstart', tryStartBgm, { once: true });
    document.addEventListener('keydown', tryStartBgm, { once: true });
  </script>
</body>
</html>
